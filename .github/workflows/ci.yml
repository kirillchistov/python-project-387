name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Формат коммитов — Conventional Commits: по ним release-please
  # формирует версию и changelog (см. AGENTS.md).
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  # Контракт — источник истины: проверяем, что openapi.yaml
  # соответствует TypeSpec-исходникам и не правился руками, а Pydantic-модели
  # бэкенда (backend/app/api/schemas/generated.py) — самому openapi.yaml.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run spec:build
      - name: Contract is up to date
        run: git diff --exit-code docs/api/openapi.yaml
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
        working-directory: backend
      - run: ./scripts/generate_schemas.sh
        working-directory: backend
      - name: Generated Pydantic schemas are up to date
        run: git diff --exit-code backend/app/api/schemas/generated.py

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pytest
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # Компонентные тесты: страницы монтируются в Chromium с замоканным API
  component-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:ct
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ct-report
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run e2e tests
        run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
