# Пауза: release-please с release-type: node оставлен от JS-проекта.
# На push в main не запускается. Conventional Commits по-прежнему
# проверяет commitlint в ci.yml. Вернуть авторелизы — снова on.push.branches: [main].
# Ручной запуск: Actions → release-please → Run workflow.
name: release-please

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
